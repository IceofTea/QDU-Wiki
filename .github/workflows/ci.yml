name: ci
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
            token: ${{ secrets.GITHUB_TOKEN }}
            fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install mkdocs mkdocs-material mkdocs-git-revision-date-localized-plugin mkdocs-git-committers-plugin-2 jieba
      # 先构建站点：build_kb 的标题锚点取自 site/ 真实产物（否则中文标题 _N 编号会错位 → 线上 404）
      - run: mkdocs build --strict
      - run: python scripts/build_kb.py
      - run: python scripts/test_kb.py
      - run: python scripts/check_kb_links.py
      - run: python scripts/build_graph.py
      - run: python scripts/check_links.py
      - run: mkdocs gh-deploy --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
