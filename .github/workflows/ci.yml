name: ci
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
            token: ${{ secrets.GITHUB_TOKEN }}
            fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install mkdocs mkdocs-material mkdocs-git-revision-date-localized-plugin mkdocs-git-committers-plugin-2 jieba
      # 先构建站点：build_kb 的标题锚点取自 site/ 真实产物（否则中文标题 _N 编号会错位 → 线上 404）
      # 注意：CI=true 会启用 git-committers 插件，无 token 时它必打一条 WARNING，
      # --strict 会把 WARNING 放大为 fatal → 此处必须与 gh-deploy 一样注入 GITHUB_TOKEN
      - run: mkdocs build --strict
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python scripts/build_kb.py
      - run: python scripts/test_kb.py
      - run: python scripts/check_kb_links.py
      - run: python scripts/build_graph.py
      - run: python scripts/check_links.py
      # 站点产物级死链/锚点审计（扫 site/**/*.html 的 href/src；须在 build_kb/build_graph 之后）
      - run: python scripts/check_site_links.py
      - run: mkdocs gh-deploy --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
